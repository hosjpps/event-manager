<article class="card event-card mb-3">
    <div class="card-body">
        <h2 class="card-title">
            {{ event.title|default:"Без названия" }}
        </h2>

        <p class="card-text">
            {{ event.starts_at|date:"d.m.Y H:i" }},
            <a href="{{ event.venue.get_absolute_url }}">
                {{ event.venue.name }}
            </a>
        </p>

        <p class="card-text">
            <span class="badge {% if event.status == 'active' %}bg-success{% elif event.status == 'cancelled' %}bg-danger{% else %}bg-secondary{% endif %}">
                {{ event.get_status_display }}
            </span>
        </p>

        {% if event.registered is not None %}
            <p class="card-text">
                Зарегистрировано {{ event.registered }} из {{ event.capacity }}
            </p>
        {% endif %}

        <a
            href="{% url 'events:detail' event.id %}"
            class="btn btn-primary"
        >
            Подробнее
        </a>
    </div>
</article>
