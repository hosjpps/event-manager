<article class="card event-card mb-3">
    <div class="card-body">
        <h2 class="card-title">
            {{ event.title|default:"Без названия" }}
        </h2>

        <p class="card-text">
            {{ event.starts_at_text }},
            <a href="{% url 'venues:detail' event.venue_id %}">
                {{ event.venue_name }}
            </a>
        </p>

        <a
            href="{% url 'events:detail' event.id %}"
            class="btn btn-primary"
        >
            Подробнее
        </a>
    </div>
</article>
