{% extends "base.html" %}

{% block title %}
    Фото: {{ venue.name }} – Event Manager
{% endblock %}

{% block content %}
    <h1>Фото площадки «{{ venue.name }}»</h1>

    <form method="post" enctype="multipart/form-data" class="col-lg-6">
        {% csrf_token %}
        {{ form.photo }}
        <div class="form-text">{{ form.photo.help_text }}</div>
        {% for error in form.photo.errors %}
            <div class="text-danger small">{{ error }}</div>
        {% endfor %}
        <button type="submit" class="btn btn-primary mt-3">Сохранить</button>
        <a href="{{ venue.get_absolute_url }}" class="btn btn-outline-secondary mt-3">Назад</a>
    </form>
{% endblock %}
